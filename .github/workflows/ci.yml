name: CI - HelpMed API CEP

on:
  push:
    branches:
      - main
      - feature/api-cep

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test